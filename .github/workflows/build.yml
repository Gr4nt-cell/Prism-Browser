name: Build APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore release signing keystore
        shell: bash
        env:
          IBROWSER_KEYSTORE_BASE64: ${{ secrets.IBROWSER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$IBROWSER_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing IBROWSER_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$IBROWSER_KEYSTORE_BASE64" | base64 --decode > app/ibrowser.jks
          test -s app/ibrowser.jks
          chmod 600 app/ibrowser.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        shell: bash
        env:
          IBROWSER_KEYSTORE_PATH: ${{ github.workspace }}/app/ibrowser.jks
          IBROWSER_KEYSTORE_PASSWORD: ${{ secrets.IBROWSER_KEYSTORE_PASSWORD }}
          IBROWSER_KEY_ALIAS: ${{ secrets.IBROWSER_KEY_ALIAS }}
          IBROWSER_KEY_PASSWORD: ${{ secrets.IBROWSER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$IBROWSER_KEYSTORE_PASSWORD" || -z "$IBROWSER_KEY_ALIAS" || -z "$IBROWSER_KEY_PASSWORD" ]]; then
            echo "::error::One or more release signing secrets are missing"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin build-logs

      - name: Collect signed outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/iBrowser.apk
          cp app/build/outputs/bundle/release/app-release.aab out/iBrowser.aab
          sha256sum out/iBrowser.apk out/iBrowser.aab > out/SHA256SUMS

      - name: Verify APK signature
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose out/iBrowser.apk
          jarsigner -verify out/iBrowser.aab

      - uses: actions/upload-artifact@v4
        with:
          name: iBrowser-signed
          path: out/

      - name: Publish signed build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          overwrite: true
          fail_on_unmatched_files: true
          files: |
            out/iBrowser.apk
            out/iBrowser.aab
