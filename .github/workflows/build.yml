name: Build APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and AAB (unsigned)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin build-logs

      - name: Collect unsigned outputs and signing tools
        shell: bash
        run: |
          mkdir -p out/tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/iBrowser-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab out/iBrowser-unsigned.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          cp "$BT/lib/apksigner.jar" out/tools/
          cp "$BT/zipalign" out/tools/
          cp "$BT"/lib64/libc++.so out/tools/lib64/ 2>/dev/null || true
          ls -laR out

      - uses: actions/upload-artifact@v4
        with:
          name: iBrowser-unsigned
          path: out/
