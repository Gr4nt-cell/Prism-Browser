name: Build APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin build-logs

      - name: Collect and verify signatures
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/iBrowser.apk
          cp app/build/outputs/bundle/release/app-release.aab out/iBrowser.aab
          # the AAB is self-signed with app/ibrowser.jks (same key as the APK)
          jarsigner -verify out/iBrowser.aab | tail -1
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/iBrowser.apk | head -3 || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: iBrowser-apk-aab
          path: |
            out/iBrowser.apk
            out/iBrowser.aab

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: iBrowser (latest build)
          body: |
            Automatic build from commit ${{ github.sha }}.
            - **iBrowser.apk** — install directly on your Android phone.
            - **iBrowser.aab** — Android App Bundle, self-signed with the iBrowser key (for Play Console upload or bundletool).
          prerelease: false
          make_latest: true
          files: |
            out/iBrowser.apk
            out/iBrowser.aab
